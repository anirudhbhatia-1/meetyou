packages:
  - shared/*
  - tools/*
  - extension
  - backend/apps/*
  - backend/packages/*

allowBuilds:
  # esbuild's postinstall only verifies the platform binary that pnpm already installs as an
  # optional dependency (@esbuild/<platform>); not needed.
  esbuild: false
  # protobufjs (via @google-cloud/speech) has a postinstall that only checks versions; not needed.
  protobufjs: false
