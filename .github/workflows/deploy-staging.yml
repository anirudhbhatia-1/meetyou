name: Deploy staging

# Azure staging (ADR-0012): every green CI run on main builds the images, migrates the database,
# rolls out the apps and runs the smoke job (STAGING_SETUP "Azure" A.6). Keyless: GitHub OIDC →
# federated credential on the deployer identity (infra/azure/ci.tf). Image-only updates keep
# each app's environment and secrets as Terraform set them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Skipped (not failed) until the repository variables from the runbook are set. A manual run
    # deploys main only: dispatching another branch bypassed the green-CI gate (2026-11-09 audit).
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      PREFIX: meetyou-staging
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for app in api gateway worker web migrate smoke; do
            docker build -f "Dockerfile.$app" -t "$REGISTRY/$app:$TAG" .
            docker push "$REGISTRY/$app:$TAG"
          done

      # First run (runbook A.6): the images exist before Terraform creates the apps, so the
      # remaining steps skip until the apps are there.
      - name: Check the apps exist
        id: apps
        run: |
          if az containerapp show --name "$PREFIX-api" --resource-group "$RG" --query name -o tsv >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Apps not created yet: images pushed with tag $TAG; apply infra/azure with image_tag=$TAG."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate the database
        if: steps.apps.outputs.ready == 'true'
        run: |
          az containerapp job update --name "$PREFIX-migrate" --resource-group "$RG" --image "$REGISTRY/migrate:$TAG" -o none
          ./.github/scripts/run-aca-job.sh "$PREFIX-migrate" "$RG"

      # Worker first: it installs the queue schema the gateway and API enqueue into.
      - name: Deploy apps
        if: steps.apps.outputs.ready == 'true'
        run: |
          for app in worker api gateway web; do
            az containerapp update --name "$PREFIX-$app" --resource-group "$RG" --image "$REGISTRY/$app:$TAG" -o none
          done

      # The API and gateway scale to zero, and a fresh revision cold-starts: the smoke job's 15 s
      # request timeout failed on it (2026-11-13). Wait until both answer first.
      - name: Wait for the new revisions
        if: steps.apps.outputs.ready == 'true'
        run: |
          for app in api gateway; do
            host=$(az containerapp show --name "$PREFIX-$app" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
            path=$([ "$app" = api ] && echo /health || echo /healthz)
            for _ in $(seq 1 36); do
              curl -fsS -m 20 "https://$host$path" >/dev/null && { echo "$app ready"; break; }
              sleep 5
            done
            curl -fsS -m 20 "https://$host$path" >/dev/null || { echo "::error::$app did not become healthy"; exit 1; }
          done

      - name: Smoke test
        if: steps.apps.outputs.ready == 'true'
        run: |
          az containerapp job update --name "$PREFIX-smoke" --resource-group "$RG" --image "$REGISTRY/smoke:$TAG" -o none
          ./.github/scripts/run-aca-job.sh "$PREFIX-smoke" "$RG"
