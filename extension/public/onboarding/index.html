<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up MeetYou</title>
  </head>
  <body>
    <main>
      <h1>Set up MeetYou</h1>
      <p>
        MeetYou can record your microphone, the Google Meet tab, and the meeting screen when you
        choose to start.
      </p>
      <p>
        Microphone permission is requested here, from a visible extension page. Recording consent
        remains your responsibility.
      </p>
      <button id="request-microphone" type="button">Allow microphone</button>
      <p id="permission-status" role="status"></p>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
